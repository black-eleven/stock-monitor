<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港股盯盘工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">📊 港股盯盘工具</h1>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="watchlist">自选股</button>
      <button class="tab-btn" data-tab="kline">K线</button>
      <button class="tab-btn" data-tab="holdings">持仓</button>
      <button class="tab-btn" data-tab="alerts">预警</button>
      <button class="tab-btn" data-tab="analysis">分析</button>
    </nav>
    <div class="connection-status" id="connStatus">连接中...</div>
  </header>

  <main class="tab-content">
    <!-- Watchlist Tab -->
    <section id="tab-watchlist" class="tab-pane active">
      <div class="watchlist-header">
        <button class="btn btn-primary" id="addWatchlistBtn">+ 添加自选股</button>
      </div>
      <div class="index-bar" id="indexBar"></div>
      <div class="stock-tabs" id="stockTabs"></div>
      <div class="stock-detail" id="stockDetail">
        <div class="empty-state">点击上方 + 添加自选股 开始</div>
      </div>
      <div class="chart-container" id="chartContainer"></div>
    </section>

    <!-- Kline Tab -->
    <section id="tab-kline" class="tab-pane">
      <div class="symbol-selector">
        <select id="klineSymbol"></select>
        <div class="kline-intervals" id="klineIntervals">
          <button class="interval-btn" data-kt="5m">5分</button>
          <button class="interval-btn active" data-kt="1d">日K</button>
          <button class="interval-btn" data-kt="1w">周K</button>
          <button class="interval-btn" data-kt="1M">月K</button>
        </div>
      </div>
      <div class="chart-container chart-large" id="klineChartContainer"></div>
    </section>

    <!-- Holdings Tab -->
    <section id="tab-holdings" class="tab-pane">
      <button class="btn btn-primary" id="addHoldingBtn">+ 添加持仓</button>
      <div class="holdings-summary" id="holdingsSummary"></div>
      <table class="data-table" id="holdingsTable">
        <thead><tr>
          <th>股票</th><th>股数</th><th>成本价</th><th>现价</th><th>盈亏</th><th>盈亏率</th><th>操作</th>
        </tr></thead>
        <tbody id="holdingsBody"></tbody>
      </table>
      <div class="modal-overlay hidden" id="holdingModal">
        <div class="modal">
          <h3>添加持仓</h3>
          <form id="holdingForm">
            <input name="symbol" placeholder="股票代码 (如 HK:700)" required>
            <input name="name" placeholder="股票名称" required>
            <input name="shares" type="number" step="1" placeholder="股数" required>
            <input name="avgCost" type="number" step="0.01" placeholder="成本价" required>
            <input name="buyDate" type="date">
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn" id="cancelHolding">取消</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Alerts Tab -->
    <section id="tab-alerts" class="tab-pane">
      <button class="btn btn-primary" id="addAlertBtn">+ 添加预警</button>
      <div class="alert-list" id="alertList"></div>
      <h3>最近触发记录</h3>
      <div class="alert-log" id="alertLog"></div>
      <div class="modal-overlay hidden" id="alertModal">
        <div class="modal">
          <h3>添加预警</h3>
          <form id="alertForm">
            <input name="symbol" placeholder="股票代码 (如 HK:700)" required>
            <select name="type">
              <option value="above">涨破</option>
              <option value="below">跌破</option>
              <option value="change_pct">涨跌幅达 %</option>
            </select>
            <input name="value" type="number" step="0.01" placeholder="触发值" required>
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn" id="cancelAlert">取消</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Analysis Tab -->
    <section id="tab-analysis" class="tab-pane">
      <div id="analysisList"></div>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <!-- TradingView Lightweight Charts (CDN) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <!-- App scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/kline.js"></script>
  <script src="js/holdings.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
