<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Monitor - 管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0d1117; color: #e6edf3;
    max-width: 800px; margin: 40px auto; padding: 20px;
  }
  h1 { font-size: 24px; margin-bottom: 24px; }
  h2 { font-size: 18px; margin: 24px 0 12px; color: #8b949e; }
  .nav { margin-bottom: 24px; }
  .nav a { color: #58a6ff; text-decoration: none; font-size: 14px; }
  .form-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  .form-group { flex: 1; }
  label { display: block; margin-bottom: 4px; font-size: 13px; color: #8b949e; }
  input {
    width: 100%; padding: 8px 12px;
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; font-size: 14px;
  }
  button {
    padding: 8px 16px; background: #1f6feb; color: white;
    border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #388bfd; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #30363d; }
  th { color: #8b949e; font-size: 13px; }
  td { font-size: 14px; }
  .btn-sm { padding: 4px 8px; font-size: 12px; }
  .copy-btn { background: #30363d; color: #e6edf3; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; font-size: 12px; margin-left: 8px; }
  .copy-btn:hover { background: #484f58; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">← 返回主页</a>
</div>
<h1>邀请码管理</h1>

<form id="generateForm">
  <div class="form-row">
    <div class="form-group">
      <label>最大使用次数（0=无限）</label>
      <input type="number" name="maxUses" value="1" min="0">
    </div>
    <div class="form-group">
      <label>生成数量</label>
      <input type="number" name="count" value="1" min="1" max="10">
    </div>
    <button type="submit">生成邀请码</button>
  </div>
</form>

<h2>已有邀请码</h2>
<table>
  <thead>
    <tr><th>邀请码</th><th>最大次数</th><th>已用次数</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
  </thead>
  <tbody id="codeTableBody"></tbody>
</table>

<script src="/js/auth.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
