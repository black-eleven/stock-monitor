<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票盯盘工具 — A股/美股/港股</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">📊 股票盯盘工具</h1>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="dashboard">仪表盘</button>
      <button class="tab-btn" data-tab="watchlist">自选股</button>
      <button class="tab-btn" data-tab="holdings">持仓</button>
    </nav>
    <div style="display:flex;align-items:center;">
      <span id="connStatus" class="connection-status">未连接</span>
      <button id="logoutBtn" style="background:none;border:1px solid #30363d;color:#e6edf3;padding:4px 12px;border-radius:4px;cursor:pointer;margin-left:8px;font-size:13px;">退出</button>
      <a id="adminLink" href="/admin.html" style="display:none;color:#58a6ff;margin-left:8px;font-size:13px;">管理</a>
    </div>
  </header>

  <main class="tab-content">
    <!-- Dashboard Tab -->
    <section id="tab-dashboard" class="tab-pane active">
      <div class="index-cards" id="indexCards"></div>
      <div class="dashboard-row">
        <div class="dashboard-card">
          <h3 class="dashboard-card-title">今日涨幅 Top 3</h3>
          <div id="topGainersList"></div>
        </div>
        <div class="dashboard-card">
          <h3 class="dashboard-card-title">今日跌幅 Top 3</h3>
          <div id="topLosersList"></div>
        </div>
      </div>
      <div class="dashboard-row">
        <div class="dashboard-card">
          <h3 class="dashboard-card-title">最强买入信号</h3>
          <div id="topSignalsList"></div>
        </div>
        <div class="dashboard-card">
          <h3 class="dashboard-card-title">最近预警</h3>
          <div id="recentAlertsList"></div>
        </div>
      </div>
    </section>

    <!-- Watchlist Tab -->
    <section id="tab-watchlist" class="tab-pane">
      <div class="watchlist-header">
        <div class="watchlist-subtabs">
          <button class="subtab-btn active" data-subtab="my">我的自选</button>
          <button class="subtab-btn" data-subtab="recommend">推荐发现</button>
        </div>
        <button class="btn btn-primary" id="addWatchlistBtn">+ 添加自选股</button>
      </div>
      <div id="watchlistMy">
        <div class="index-bar" id="indexBar"></div>
        <div class="stock-tabs" id="stockTabs"></div>
        <div class="stock-detail" id="stockDetail">
          <div class="empty-state">点击上方 + 添加自选股 开始</div>
        </div>
        <div class="kline-intervals" id="watchlistKlineIntervals" style="display:none;margin-bottom:8px;">
          <button class="interval-btn" data-kt="5m">5分</button>
          <button class="interval-btn active" data-kt="1d">日K</button>
          <button class="interval-btn" data-kt="1w">周K</button>
          <button class="interval-btn" data-kt="1M">月K</button>
        </div>
        <div class="chart-container chart-large" id="watchlistChartContainer" style="display:none;"></div>
        <div id="watchlistAnalysis" style="display:none;"></div>
      </div>
      <div id="watchlistRecommend" style="display:none">
        <div class="recommend-search">
          <input type="text" id="recommendIndustry" placeholder="输入行业关键词 (如 AI, 新能源, 半导体)" />
          <button class="btn btn-primary" id="recommendSearchBtn">搜索</button>
        </div>
        <div id="recommendStatus" class="empty-state">输入行业关键词搜索推荐股票</div>
        <div id="recommendResults"></div>
      </div>
    </section>

    <!-- Holdings Tab -->
    <section id="tab-holdings" class="tab-pane">
      <button class="btn btn-primary" id="addHoldingBtn">+ 添加持仓</button>
      <div class="holdings-summary" id="holdingsSummary"></div>
      <table class="data-table" id="holdingsTable">
        <thead><tr>
          <th>股票</th><th>股数</th><th>成本价</th><th>现价</th><th>盈亏</th><th>盈亏率</th><th>预警</th><th>操作</th>
        </tr></thead>
        <tbody id="holdingsBody"></tbody>
      </table>

      <h3 style="margin-top:24px;margin-bottom:8px;color:#e6edf3;">最近触发记录</h3>
      <div class="alert-log" id="alertLog"></div>

      <div class="modal-overlay hidden" id="holdingModal">
        <div class="modal">
          <h3>添加持仓</h3>
          <form id="holdingForm">
            <input name="symbol" placeholder="股票代码 (如 HK:700 / SH:600519 / US:AAPL)" required>
            <input name="name" placeholder="股票名称" required>
            <input name="shares" type="number" step="1" placeholder="股数" required>
            <input name="avgCost" type="number" step="0.01" placeholder="成本价" required>
            <input name="buyDate" type="date">
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn" id="cancelHolding">取消</button>
            </div>
          </form>
        </div>
      </div>

      <div class="modal-overlay hidden" id="alertModal">
        <div class="modal">
          <h3>添加预警</h3>
          <form id="alertForm">
            <input name="symbol" placeholder="股票代码 (如 HK:700 / SH:600519 / US:AAPL)" required>
            <select name="type">
              <option value="above">涨破</option>
              <option value="below">跌破</option>
              <option value="change_pct">涨跌幅达 %</option>
            </select>
            <input name="value" type="number" step="0.01" placeholder="触发值" required>
            <div class="modal-actions">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn" id="cancelAlert">取消</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <!-- TradingView Lightweight Charts (CDN) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <!-- App scripts -->
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/kline.js"></script>
  <script src="js/holdings.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
